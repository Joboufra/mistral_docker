<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repsol FAQs</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <img src="https://www.repsol.es/content/dam/repsol-ecommerce/icons/logo.png.transform/rp-rendition-xs/image.png" alt="Logo Repsol"/>

    <div id="chat-container">
        <div id="chat"></div>
        <div style="position: relative; display: flex; align-items: center;">
            <input id="pregunta" type="text" placeholder="Escribe tu pregunta..." style="flex: 1;">
            <span id="send-button">
                <svg width="25" height="25" viewBox="0 0 24 24" fill="grey" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2 21L23 12L2 3V10L17 12L2 14V21Z" />
                </svg>
            </span>
        </div>
        <div id="spinner">
            <div class="spinner-loader"></div>
        </div>
    </div>

    <button id="mode-toggle" aria-label="Toggle Dia/Noche">
        <!-- SVG inicial, se actualizará por JS -->
    </button>
      
    <button id="clear-chat" aria-label="Limpiar chat">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 0V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
    </button>

    <script>
        const toggleButton = document.getElementById('mode-toggle');

        const icons = {
            day: `
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            `,
            night: `
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
                </svg>
            `
        };

        function updateModeIcon(isDarkMode) {
            toggleButton.innerHTML = isDarkMode ? icons.night : icons.day;
        }

        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            updateModeIcon(true);
        } else {
            updateModeIcon(false);
        }

        toggleButton.addEventListener('click', function() {
            document.body.classList.toggle("dark-mode");
            const isDarkMode = document.body.classList.contains("dark-mode");
            localStorage.setItem('darkMode', isDarkMode);
            updateModeIcon(isDarkMode);
        });

        const savedMessages = JSON.parse(localStorage.getItem('chatHistory')) || [];
        savedMessages.forEach(msg => agregarMensaje(msg.texto, msg.tipo));

        function enviarPregunta() {
            const preguntaInput = document.getElementById("pregunta");
            const pregunta = preguntaInput.value.trim();
            if (!pregunta) return;

            const spinner = document.getElementById("spinner");

            agregarMensaje(pregunta, 'user');
            guardarMensaje(pregunta, 'user');
            preguntaInput.value = "";

            spinner.style.display = "flex";
            spinner.style.opacity = "0";
            setTimeout(() => spinner.style.opacity = "1", 10);

            fetch("/", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: `pregunta=${encodeURIComponent(pregunta)}`
            })
            .then(response => response.json())
            .then(data => {
                agregarMensaje(data.respuesta, 'bot');
                guardarMensaje(data.respuesta, 'bot');
            })
            .catch(err => {
                const errorMsg = "Error al procesar la respuesta.";
                agregarMensaje(errorMsg, 'bot');
                guardarMensaje(errorMsg, 'bot');
            })
            .finally(() => {
                spinner.style.opacity = "0";
                setTimeout(() => spinner.style.display = "none", 300);
            });
        }

        function agregarMensaje(texto, tipo) {
            const chat = document.getElementById("chat");
            const mensaje = document.createElement("div");
            mensaje.className = `message ${tipo}`;
            mensaje.textContent = texto;
            chat.appendChild(mensaje);
            chat.scrollTop = chat.scrollHeight;
        }

        function guardarMensaje(texto, tipo) {
            const historial = JSON.parse(localStorage.getItem('chatHistory')) || [];
            historial.push({ texto, tipo });
            localStorage.setItem('chatHistory', JSON.stringify(historial));
        }

        document.getElementById("pregunta").addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                enviarPregunta();
            }
        });

        document.getElementById("send-button").addEventListener("click", enviarPregunta);

        document.getElementById("clear-chat").addEventListener("click", function() {
            localStorage.removeItem('chatHistory');
            const chat = document.getElementById("chat");
            chat.innerHTML = "";
        });
    </script>
</body>
</html>
